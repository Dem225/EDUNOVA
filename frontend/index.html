
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Rejoignez EDUNOVA, une initiative éducative pour rendre le savoir accessible à tous.">

    <title>EDUNOVA — Candidature</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>EDUNOVA</h1>
        <p>L'éducation sans frontières, le savoir pour tous.</p>
    </header>

    <main>
        <section>
            <h2>Rejoindre EDUNOVA</h2>

            <p>
                Remplissez ce formulaire pour demander votre participation
                à notre programme éducatif pilote.
            </p>

            <form id="application-form">

                <div>
                    <label for="nom">Nom</label>
                    <input type="text" id="nom" name="nom" required>
                </div>

                <div>
                    <label for="prenom">Prénom(s)</label>
                    <input type="text" id="prenom" name="prenom" required>
                </div>

                <div>
                    <label for="email">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div>
                    <label for="telephone">Téléphone</label>
                    <input type="tel" id="telephone" name="telephone">
                </div>

                <div>
                    <label for="niveau">Votre parcours éducatif</label>

                    <select id="niveau" name="niveau" required>
                        <option value="">Choisissez votre parcours</option>
                        <option value="primaire">EDUNOVA Junior — Primaire</option>
                        <option value="college">EDUNOVA Collège — Collège</option>
                        <option value="lycee">EDUNOVA Lycée — Lycée</option>
                        <option value="universite">EDUNOVA University — Université</option>
                        <option value="formation_professionnelle">EDUNOVA Skills — Formation professionnelle</option>
                    </select>
                </div>

                <div>
                    <label for="motivation">Pourquoi souhaitez-vous rejoindre EDUNOVA ?</label>
                    <textarea
                        id="motivation"
                        name="motivation"
                        rows="6"
                        minlength="20"
                        required
                    ></textarea>
                </div>

                <button type="submit">Envoyer ma candidature</button>

            </form>

            <p id="message" role="status" aria-live="polite"></p>
        </section>
    </main>

    <footer>
        <p>© 2026 EDUNOVA — L'éducation sans frontières.</p>
    </footer>
	<script src="js/application.js"></script>
</body>
</html>
